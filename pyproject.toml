[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-platform-namecheap"
version = "0.1.0"  # the plugin's own release (CHANGELOG.md); the platform shows it on the plugin's page
description = "Namecheap for Liminal's platform: your domains and their records through Namecheap's API (every other record and the mail setting kept on a write), and Dynamic DNS keeping hosts at this network's address."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the machine kind: liminal_libs.machines, plugin API 2.1; the Login interface: liminal_libs.apps)
dependencies = ["liminal-libs>=1.26.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
namecheap = "plugin_platform_namecheap"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
